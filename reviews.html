<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width,initial-scale=1" />
 <title>Reviews — Life Link</title>
 <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 <link rel="preload" as="style" onload="this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?display=swap&family=Noto+Sans:wght@400;500;700;900&family=Public+Sans:wght@400;500;700;900" />
</head>
<body class="bg-[#fcf8f8] min-h-screen flex items-center justify-center" style="font-family: 'Public Sans', 'Noto Sans', sans-serif">
<div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow">
<h1 class="text-2xl font-bold text-[#1b0e0e] mb-4">Submit Review</h1>
<form id="rform" class="space-y-4">
<label class="block text-sm">Hospital ID <input id="hid" class="mt-1 block w-full rounded-md border p-2" required /></label>
<label class="block text-sm">Rating (1-5) <input id="rating" type="number" min="1" max="5" class="mt-1 block w-full rounded-md border p-2" required /></label>
<label class="block text-sm">Review <textarea id="rev" class="mt-1 block w-full rounded-md border p-2"></textarea></label>
<label class="inline-flex items-center"><input type="checkbox" id="consent" class="mr-2"/> Show publicly</label>
<div class="flex gap-3">
<button class="px-4 py-2 bg-[#ec1313] text-white rounded-lg">Submit</button>
<a href="/" class="px-4 py-2 bg-gray-200 rounded-lg">Cancel</a>
</div>
</form>
<h2 class="mt-6 text-lg font-semibold">Public Reviews</
