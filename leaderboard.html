<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Leaderboard</title>
  </head>
  <body style="font-family: Arial, sans-serif; padding: 20px">
    <h2>Top Donors</h2>
    <div id="list">Loading...</div>
    <script>
      async function load() {
        const r = await fetch("http://localhost:4001/leaderboard");
        const j = await r.json();
        const list = document.getElementById("list");
        list.innerHTML = "";
        (j.top || []).forEach((d, i) => {
          const div = document.createElement("div");
          div.innerHTML = `${i + 1}. ${d.name || "Anonymous"} — ${
            d.donations_count || 0
          } donations`;
          list.appendChild(div);
        });
      }
      load();
    </script>
  </body>
</html>
