        padding: 12px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);

        gap: 8px;
        margin-bottom: 6px;
      }

        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-block;
        border: 2px solid #fff;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);

        font-size: 0.8rem;
      }

        color: #2a8b2a;

        left: 14px;

        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      L.control
        .locate({
          position: "topleft",
          strings: { title: "Show my location" },
          flyTo: true,
          setView: "once",
          locateOptions: { enableHighAccuracy: true, maxZoom: 16 },
        })
        .addTo(map);
      L.Control.geocoder({
        defaultMarkGeocode: false,
        placeholder: "Search location...",
      })
        .on("markgeocode", function (e) {
          const dest = e.geocode.center;
          L.marker(dest)
            .addTo(map)
            .bindPopup("📍 " + e.geocode.name)
            .openPopup();
          map.setView(dest, 13);
        })
        .addTo(map);

      let userMarker = null;

      // -------------------------
      // Utilities
      // -------------------------
      function normalize(s) {
        return (s || "").toString().trim().toLowerCase().replace(/\s+/g, " ");
      }
      function escapeHtml(str) {
        return (str + "").replace(/[&<>"'`=\/]/g, function (s) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
            "/": "&#x2F;",
            "`": "&#x60;",
            "=": "&#x3D;",
          }[s];
        });
      }
      function getDistanceKm(lat1, lon1, lat2, lon2) {
        const toRad = (v) => (v * Math.PI) / 180;
        const R = 6371;
        const dLat = toRad(lat2 - lat1),
          dLon = toRad(lon2 - lon1);
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(lat1)) *
            Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) ** 2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      // -------------------------
      // Markers (red for banks, blue for user)
      // -------------------------
      function clearBankMarkers() {
        markerCluster.clearLayers();
        bankMarkers = [];
      }

      function createBankIcon() {
        // red circular icon
        return L.divIcon({
          className: "bank-marker",
          html: '<div style="background:#cc0000; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.3);"></div>',
          iconSize: [20, 20],
          iconAnchor: [10, 10],
        });
      }

      function createUserIcon() {
        return L.divIcon({
          className: "user-marker",
          html: '<div style="background:#0066cc; width:20px; height:20px; border-radius:50%; border:3px solid white; box-shadow:0 0 6px rgba(0,0,0,0.3);"></div>',
          iconSize: [26, 26],
          iconAnchor: [13, 13],
        });
      }

      function addBankMarkers(banks) {
        clearBankMarkers();
        const icon = createBankIcon();
        banks.forEach((bank) => {
          const marker = L.marker([bank.lat, bank.lng], {
            icon,
            title: bank.name,
          });
          const statusClass =
            bank.status === "open" ? "status-open" : "status-closed";
          const popupHtml = `<div class="blood-bank-popup">
        <h3>${escapeHtml(bank.name)}</h3>
        <p><strong>Address:</strong> ${escapeHtml(bank.address)}</p>
        <p><strong>Phone:</strong> <a href="tel:${bank.phone}">${
            bank.phone
          }</a></p>
        <p><strong>Hours:</strong> ${escapeHtml(bank.hours)}</p>
        <p><strong>Status:</strong> <span class="status ${statusClass}">${bank.status.toUpperCase()}</span></p>
        <div style="margin-top:8px; display:flex; gap:8px;">
          <button class="btn get-directions" data-lat="${bank.lat}" data-lng="${
            bank.lng
          }">Get Directions</button>
          <button class="btn call-btn"><a href="tel:${
            bank.phone
          }" style="color:inherit; text-decoration:none;">Call</a></button>
        </div>
      </div>`;
          marker.bindPopup(popupHtml);
          markerCluster.addLayer(marker);
          bankMarkers.push({ marker, bank });
        });
        fitMapToMarkers();
      }

      function fitMapToMarkers() {
        const layers = markerCluster.getLayers();
        if (!layers || layers.length === 0) {
          if (userMarker)
            map.setView([currentCoords.lat, currentCoords.lng], 11);
          return;
        }
        const group = new L.featureGroup([...layers]);
        if (userMarker) group.addLayer(userMarker);
        map.fitBounds(group.getBounds().pad(0.1), { maxZoom: 13 });
      }

      // -------------------------
      // Filtering and nearest
      // -------------------------
      function filterByDistrict(selected) {
        const sel = normalize(selected);
        if (sel === "all" || sel === "") return tamilNaduBloodBanks.slice();
        return tamilNaduBloodBanks.filter((b) => normalize(b.district) === sel);
      }

      function nearestBanks(n = 10) {
        if (!currentCoords) return [];
        const arr = tamilNaduBloodBanks.map((b) => ({
          ...b,
          dist: getDistanceKm(
            currentCoords.lat,
            currentCoords.lng,
            b.lat,
            b.lng
          ),
        }));
        arr.sort((a, b) => a.dist - b.dist);
        return arr.slice(0, n);
      }

      function renderFindList() {
        const el = document.getElementById("findList");
        const list = nearestBanks(20);
        if (!list || list.length === 0) {
          el.style.display = "none";
          el.setAttribute("aria-hidden", "true");
          return;
        }
        el.innerHTML = "";
        list.forEach((item) => {
          const div = document.createElement("div");
          div.className = "find-item";
          div.innerHTML = `<div style="max-width:66%"><strong>${escapeHtml(
            item.name
          )}</strong>
        <div style="font-size:0.85rem;color:#555;">${escapeHtml(
          item.address
        )}</div></div>
        <div style="text-align:right"><div style="font-weight:700">${item.dist.toFixed(
          1
        )} km</div>
        <div style="margin-top:6px;"><button class="btn small-btn get-directions" data-lat="${
          item.lat
        }" data-lng="${item.lng}">Directions</button></div></div>`;
          el.appendChild(div);
        });
        el.style.display = "block";
        el.setAttribute("aria-hidden", "false");
      }

      // -------------------------
      // Directions (lazy load)
      // -------------------------
      function loadRoutingLibrary(callback) {
        if (window.L && L.Routing) return callback();
        const s = document.createElement("script");
        s.src =
          "https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.min.js";
        s.onload = callback;
        document.body.appendChild(s);
      }

      function getDirectionsTo(lat, lng) {
        if (!currentCoords) {
          alert("Current location not available. Please allow location.");
          return;
        }
        if (routingControl) {
          try {
            map.removeControl(routingControl);
          } catch (e) {}
          routingControl = null;
        }
        loadRoutingLibrary(() => {
          routingControl = L.Routing.control({
            waypoints: [
              L.latLng(currentCoords.lat, currentCoords.lng),
              L.latLng(lat, lng),
            ],
            routeWhileDragging: false,
            lineOptions: {
              styles: [{ color: "#cc0000", weight: 5, opacity: 0.8 }],
            },
            showAlternatives: false,
          }).addTo(map);
        });
      }

      function clearRoute() {
        if (routingControl) {
          try {
            map.removeControl(routingControl);
          } catch (e) {}
          routingControl = null;
        }
      }

      // -------------------------
      // Map location events
      // -------------------------
      map.on("locationfound", function (e) {
        currentCoords = e.latlng;
        if (userMarker) {
          try {
            map.removeLayer(userMarker);
          } catch (e) {}
          userMarker = null;
        }
        userMarker = L.marker([currentCoords.lat, currentCoords.lng], {
          icon: createUserIcon(),
          title: "You are here",
        })
          .addTo(map)
          .bindPopup("📍 You are here");
        fitMapToMarkers();
      });

      map.on("locationerror", function () {
        // default to Chennai if denied
        currentCoords = { lat: 13.0827, lng: 80.2707 };
        if (userMarker) {
          try {
            map.removeLayer(userMarker);
          } catch (e) {}
          userMarker = null;
        }
        userMarker = L.marker([currentCoords.lat, currentCoords.lng], {
          icon: createUserIcon(),
        })
          .addTo(map)
          .bindPopup("📍 Default: Chennai");
        fitMapToMarkers();
      });

      // locate on load
      map.locate({ setView: false, maxZoom: 13 });

      // -------------------------
      // Delegated event handling
      // -------------------------
      document.getElementById("map").addEventListener("click", function (e) {
        const btn = e.target.closest(".get-directions");
        if (btn) {
          const lat = parseFloat(btn.dataset.lat),
            lng = parseFloat(btn.dataset.lng);
          if (!isNaN(lat) && !isNaN(lng)) getDirectionsTo(lat, lng);
        }
      });

      document
        .getElementById("findBloodBanks")
        .addEventListener("click", function () {
          const sel = document.getElementById("districtSelect").value;
          const filtered = filterByDistrict(sel);
          addBankMarkers(filtered);
          renderFindList();
        });

      document
        .getElementById("districtSelect")
        .addEventListener("change", function () {
          const filtered = filterByDistrict(this.value);
          addBankMarkers(filtered);
        });

      document
        .getElementById("clearRoute")
        .addEventListener("click", clearRoute);

      document
        .getElementById("toggleList")
        .addEventListener("click", function () {
          const el = document.getElementById("findList");
          if (el.style.display === "block") {
            el.style.display = "none";
            el.setAttribute("aria-hidden", "true");
          } else {
            renderFindList();
          }
        });

      // initial load: show all banks
      window.addEventListener("load", function () {
        addBankMarkers(tamilNaduBloodBanks);
      });

      // keyboard accessibility example (press 'L' to open nearest)
      document.addEventListener("keydown", function (e) {
        if (e.key === "l" || e.key === "L") {
          renderFindList();
        }
      });
    </script>
